services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: card-quest
    restart: unless-stopped
    ports:
      - "${PORT:-3011}:3011"
    environment:
      - NODE_ENV=production
      - PORT=3011
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://rift.pascadigital.my.id}
      - DB_PATH=/app/data/card-quest.sqlite
      - ADMIN_KEY=${ADMIN_KEY:-}
    volumes:
      - card-quest-data:/app/data

volumes:
  card-quest-data:
    driver: local
