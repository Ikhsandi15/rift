<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Riftbound · Card Quest RPG</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="noise"></div>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">✦</span><span>RIFTBOUND</span></a>
    <div class="topbar-right">
      <button id="btn-install-app" class="button small ghost" style="display:none">📲 Pasang App</button>
      <div id="session-actions"></div>
    </div>
  </header>
  <main id="app" class="shell"></main>
  <div id="toast" class="toast" role="status"></div>
  <div id="pwa-install-banner" class="install-banner" style="display:none">
    <div class="install-banner-text">
      <b>✦ Pasang Aplikasi Riftbound</b>
      <small>Buka lebih cepat, fullscreen & tanpa browser lag</small>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button id="pwa-install-btn" class="button small primary">📲 Pasang</button>
      <button id="pwa-dismiss-btn" class="modal-close-icon" title="Tutup">✕</button>
    </div>
  </div>
  <script src="/print.js" defer></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
