name: Android APK draft release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode release keystore
        env:
          RIFT_RELEASE_KEYSTORE_B64: ${{ secrets.RIFT_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$RIFT_RELEASE_KEYSTORE_B64"
          printf '%s' "$RIFT_RELEASE_KEYSTORE_B64" | base64 --decode > android/riftbound-release.jks

      - name: Validate signing keystore and write properties
        env:
          RIFT_RELEASE_STORE_PASSWORD: ${{ secrets.RIFT_RELEASE_STORE_PASSWORD }}
          RIFT_RELEASE_KEY_ALIAS: ${{ secrets.RIFT_RELEASE_KEY_ALIAS }}
          RIFT_RELEASE_KEY_PASSWORD: ${{ secrets.RIFT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$GITHUB_WORKSPACE/mobile/android/riftbound-release.jks"
          test -n "$RIFT_RELEASE_STORE_PASSWORD"
          test -n "$RIFT_RELEASE_KEY_ALIAS"
          test -n "$RIFT_RELEASE_KEY_PASSWORD"
          test -s "$KEYSTORE" || { echo "Keystore file missing or empty at expected workspace path."; exit 1; }
          keytool -list -keystore "$KEYSTORE" -storepass "$RIFT_RELEASE_STORE_PASSWORD" -alias "$RIFT_RELEASE_KEY_ALIAS" >/dev/null || { echo "Keystore/password/alias validation failed."; exit 1; }
          cat > android/key.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$RIFT_RELEASE_STORE_PASSWORD
          keyAlias=$RIFT_RELEASE_KEY_ALIAS
          keyPassword=$RIFT_RELEASE_KEY_PASSWORD
          EOF
          test -s android/key.properties
          echo "Signing keystore validated and Gradle properties written (secret values hidden)."

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build signed APK
        env:
          RIFT_API_BASE_URL: https://rift.pascadigital.my.id
        run: flutter build apk --release --dart-define=RIFT_API_BASE_URL=$RIFT_API_BASE_URL

      - name: Create checksum
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk.sha256
